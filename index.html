<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf5ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f11" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Petal</title>
    <style>
      html { background: #fbf5ee; }
      .splash { position: fixed; inset: 0; display: grid; place-items: center; }
      .splash svg { animation: splash 1.6s ease-in-out infinite; }
      @keyframes splash { 50% { transform: scale(0.92); opacity: 0.75; } }
      @media (prefers-color-scheme: dark) { html { background: #0f0f11; } }
      @media (prefers-reduced-motion: reduce) { .splash svg { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Shown until the app has loaded; React replaces it. -->
      <div class="splash">
        <svg viewBox="0 0 64 64" width="84" height="84" aria-hidden="true">
          <rect width="64" height="64" rx="14" fill="#d9627d" />
          <circle cx="32" cy="32" r="17" fill="none" stroke="#fffaf3" stroke-width="5" />
          <circle cx="32" cy="15" r="5.5" fill="#7a2a40" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
